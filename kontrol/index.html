<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام الكنترول الجامعي — جامعة المعقل الأهلية</title>
<meta name="description" content="نظام الكنترول الجامعي وإدارة اللجان الامتحانية — جامعة المعقل الأهلية">
<meta name="theme-color" content="#1c5a49">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="firebase-config.js"></script>
<script type="module" src="fb.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="seal">ك</div><div><h1>الكنترول الجامعي</h1><small id="sub">اللجنة الامتحانية</small></div></div>
    <div class="modechip" id="mode"><span class="dot"></span>جارٍ الاتصال…</div>
    <div class="me" id="me" hidden></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><div class="empty"><b>جارٍ تحميل سجلات الكنترول</b>لحظات ويظهر النظام.</div></main>
</div>
<div id="login" hidden>
  <form class="loginbox" id="loginform" autocomplete="on">
    <div class="brand"><div class="seal">ك</div><div><h1>نظام الكنترول</h1><small>جامعة المعقل الأهلية · اللجنة الامتحانية</small></div></div>
    <p class="mut">ادخل بحساب تطبيق الحضور نفسه (مثل doc01 أو admin).</p>
    <label class="f">اسم المستخدم<input type="text" id="lg_user" name="username" autocomplete="username" required dir="ltr"></label>
    <label class="f">كلمة المرور<input type="password" id="lg_pass" name="password" autocomplete="current-password" required dir="ltr"></label>
    <button class="btn pri" type="submit" id="lg_btn">دخول</button>
    <button class="btn" type="button" id="lg_google">الدخول بحساب Google الجامعي</button>
    <p class="red" id="lg_err" role="alert"></p>
  </form>
</div>
<div id="modal" hidden></div>
<div id="toasts"></div>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
