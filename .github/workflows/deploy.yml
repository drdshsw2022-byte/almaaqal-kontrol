name: نشر نظام الكنترول على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز الموقع وإعدادات Firebase
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_WEB_APP_ID: ${{ secrets.FB_WEB_APP_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_STORAGE_BUCKET: ${{ secrets.FB_STORAGE_BUCKET }}
          FB_AUTH_DOMAIN: ${{ secrets.FB_AUTH_DOMAIN }}
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll kontrol _site/
          if [ -n "$FB_API_KEY" ]; then
            AUTH_DOMAIN="${FB_AUTH_DOMAIN:-$FB_PROJECT_ID.firebaseapp.com}"
            printf 'window.FIREBASE_CONFIG = {apiKey:"%s",authDomain:"%s",projectId:"%s",storageBucket:"%s",messagingSenderId:"%s",appId:"%s"};\n' \
              "$FB_API_KEY" "$AUTH_DOMAIN" "$FB_PROJECT_ID" "$FB_STORAGE_BUCKET" "$FB_SENDER_ID" "$FB_WEB_APP_ID" \
              > _site/kontrol/firebase-config.js
            echo "إعدادات Firebase من أسرار المستودع: $FB_PROJECT_ID"
          elif grep -q '^window.FIREBASE_CONFIG = null' kontrol/firebase-config.js; then
            # اكتشاف تلقائي: إعدادات الويب العامة من نسخة تطبيق الحضور المنشورة على النطاق نفسه
            JS=$(mktemp)
            if curl -fsSL --retry 3 "https://${{ github.repository_owner }}.github.io/almaaqal/main.dart.js" -o "$JS"; then
              KEY=$(grep -oE 'AIza[0-9A-Za-z_-]{35}' "$JS" | head -1)
              APPID=$(grep -oE '1:[0-9]{6,}:web:[0-9a-f]+' "$JS" | head -1)
              SENDER=$(echo "$APPID" | cut -d: -f2)
              DOMAIN=$(grep -oE '[a-z0-9-]+\.firebaseapp\.com' "$JS" | head -1)
              BUCKET=$(grep -oE '[a-z0-9-]+\.(firebasestorage\.app|appspot\.com)' "$JS" | head -1)
              PROJ=$(echo "${DOMAIN:-$BUCKET}" | cut -d. -f1)
              if [ -n "$KEY" ] && [ -n "$APPID" ] && [ -n "$PROJ" ]; then
                printf 'window.FIREBASE_CONFIG = {apiKey:"%s",authDomain:"%s",projectId:"%s",storageBucket:"%s",messagingSenderId:"%s",appId:"%s"};\n' \
                  "$KEY" "${DOMAIN:-$PROJ.firebaseapp.com}" "$PROJ" "$BUCKET" "$SENDER" "$APPID" > _site/kontrol/firebase-config.js
                echo "::notice::رُبط الكنترول تلقائياً بمشروع Firebase: $PROJ (من نسخة الويب لتطبيق الحضور)"
              else
                echo "::warning::لم تُكتشف إعدادات Firebase كاملة (key=${KEY:+ok} appId=${APPID:+ok} project=$PROJ). أضف الأسرار أو عدّل kontrol/firebase-config.js"
              fi
            else
              echo "::warning::تعذر تنزيل نسخة الويب لتطبيق الحضور. أضف الأسرار أو عدّل kontrol/firebase-config.js"
            fi
          else
            echo "إعدادات Firebase من kontrol/firebase-config.js"
          fi
          # رقم إصدار جديد لعامل الخدمة حتى تتحدث النسخة المخزنة على الأجهزة
          sed -i "s/kontrol-v1/kontrol-${{ github.run_number }}/" _site/kontrol/sw.js
          # كسر الذاكرة المؤقتة للمتصفح: كل نشر يحمّل الملفات الجديدة فوراً
          V=${{ github.run_number }}
          sed -i -E "s#(src|href)=\"(app\.js|app\.css|fb\.js|firebase-config\.js)\"#\1=\"\2?v=$V\"#g" _site/kontrol/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
