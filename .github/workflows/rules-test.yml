name: اختبار قواعد Firestore
on:
  push:
    paths: ['firestore.rules', 'tests/**', 'firebase.json', '.github/workflows/rules-test.yml']
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm i --no-save --no-audit --no-fund firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - run: npx firebase emulators:exec --only firestore --project demo-kontrol "node --test tests/"
